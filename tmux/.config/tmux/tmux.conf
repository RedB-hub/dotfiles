# Prefix stays the default: Ctrl+b

# Vim keys in copy mode: v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Copied text goes to the system clipboard (through Ghostty)
set -s set-clipboard on

# Neovim: react to Esc immediately
set -s escape-time 10

# Full colors in Ghostty (for Neovim themes)
set -as terminal-features ",xterm-ghostty:RGB"

# Trackpad scrolling and clicking on panes
set -g mouse on

# Number windows and panes from 1, like the keyboard
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (1 2 3, never 1 3)
set -g renumber-windows on

# --- Status bar ---
set -g status-position bottom
set -g status-style "bg=default fg=white"
set -g status-justify absolute-centre

# Left: session pill, green normally, red while the prefix is active
set -g status-left-length 50
set -g status-left "#[fg=#{?client_prefix,red,green}]\ue0b6#[bg=#{?client_prefix,red,green} fg=black bold]\uf120 #S#[default]#[fg=#{?client_prefix,red,green}]\ue0b4#[default] "
set -ga status-left "#{?window_zoomed_flag,#[fg=yellow] zoom ,}"

# Right: computer name and time
set -g status-right-length 80
set -g status-right "#[fg=brightblack]\uf109 #h  #[fg=yellow]\uf017 %H:%M "

# Middle: windows, the current one highlighted
set -g window-status-format " #I: #W "
set -g window-status-style "fg=brightblack"
set -g window-status-current-format " #I: #W "
set -g window-status-current-style "bg=blue fg=black bold"
set -g window-status-separator "│"
